# Source-domain test. Uses the checkpoint selected only on STB validation.
seed: 2023
version: stb_100_seed2023_test_stb
device: 'cuda:0'
log_para: 1000
patch_size: 10000
mode: 'final'
num_epochs: 180
checkpoint: logs/stb_100_seed2023/best.pth
model:
  name: 'final'
  params:
    pretrained: True
    mem_size: 1024
    mem_dim: 256
    cls_thrs: 0.5
    err_thrs: 0.5
    den_dropout: 0.5
    cls_dropout: 0.3
    has_err_loss: False
test_dataset:
  name: 'den_cls'
  params:
    root: 'data/stb'
    crop_size: 320
    downsample: 1
    is_grey: False
    unit_size: 16
    pre_resize: 1
test_loader:
  batch_size: 1
  num_workers: 4
  shuffle: False
  pin_memory: False
