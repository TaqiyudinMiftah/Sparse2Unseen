# Unseen QNRF test for the hardware-constrained batch-4 training run.
# Tile at 1024 pixels because whole-image inference exceeded 12 GB GPU memory.
seed: 2023
version: stb_100_seed2023_bs4_test_qnrf_ps1024
device: 'cuda:0'
log_para: 1000
patch_size: 1024
mode: 'final'
num_epochs: 180
checkpoint: logs/stb_100_seed2023_bs4/best.pth
model:
  name: 'final'
  params:
    pretrained: True
    mem_size: 1024
    mem_dim: 256
    cls_thrs: 0.5
    err_thrs: 0.5
    den_dropout: 0.5
    cls_dropout: 0.3
    has_err_loss: False
test_dataset:
  name: 'den_cls'
  params:
    root: 'data/qnrf'
    crop_size: 320
    downsample: 1
    is_grey: False
    unit_size: 16
    pre_resize: 1
test_loader:
  batch_size: 1
  num_workers: 4
  shuffle: False
  pin_memory: False
