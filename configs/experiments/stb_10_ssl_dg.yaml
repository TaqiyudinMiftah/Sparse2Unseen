seed: 1
experiment:
  name: stb_10_ssl_dg_seed1
  regime: ssl_dg

device: cuda

data:
  source_train_manifest: data/manifests/stb_train.jsonl
  source_test_manifest: data/manifests/stb_test.jsonl
  target_test_manifests:
    sta: data/manifests/sta_test.jsonl
    qnrf: data/manifests/qnrf_test.jsonl
  split: splits/stb_10_seed1.json
  crop_size: 320
  num_workers: 8

model:
  name: vgg16_density
  pretrained: true

train:
  epochs: 180
  batch_size: 8
  unlabeled_batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  output_dir: runs/stb_10_ssl_dg_seed1

ssl:
  enabled: true
  ema_decay: 0.999
  unsup_weight: 1.0
  warmup_epochs: 10

dg:
  enabled: true
  teacher_views: 4
  region_grid: [4, 4]
  stability_beta: 4.0
  brightness: 0.35
  contrast: 0.35
  saturation: 0.25
  blur_probability: 0.25
