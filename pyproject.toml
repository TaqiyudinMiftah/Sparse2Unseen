[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse2unseen"
version = "0.1.0"
description = "Label-efficient single-domain generalization research scaffold for crowd counting"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2.0",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "tqdm>=4.65",
]

[dependency-groups]
dev = [
  "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
