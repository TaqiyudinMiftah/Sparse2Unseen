[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse2unseen"
version = "0.1.0"
description = "Label-efficient single-domain generalization research scaffold for crowd counting"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "certifi>=2024.8.30",
  "einops==0.8.0",
  "gdown>=6.2,<7",
  "glob2==0.7",
  "matplotlib==3.9.0",
  "numpy==1.26.4",
  "opencv-python==4.10.0.82",
  "pandas==2.2.2",
  "Pillow==10.3.0",
  "PyYAML==6.0.1",
  "requests==2.32.3",
  "rich==13.7.1",
  "scipy==1.13.1",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "tqdm==4.66.4",
]

[dependency-groups]
dev = [
  "pytest>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
